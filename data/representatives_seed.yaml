# Hand-curated representatives — federal, Regents, county, city, CCSD.
# State Senate + Assembly come from `representatives_nv.json` (the scraper output).
#
# Refresh after each general election. Photos: drop into static/reps/ and reference
# by relative path; profile_url should point to the official .gov page when possible.
# party = D / R / I / NP (nonpartisan); short_name is what matches item_votes.person.
# Henderson Council, CCSD Trustees, and CC Commission names come directly from each
# layer's GIS attribute (COUNCILMAN / TRUSTEE / NAME) — they update with the layer.

